name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project
        run: uv sync --frozen
      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          uv run --with ruff ruff check src tests > ruff-report.txt 2>&1
          status=$?
          cat ruff-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff report
        if: steps.lint.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.python-version }}
          path: ruff-report.txt
      - name: Fail on lint errors
        if: steps.lint.outputs.status != '0'
        run: exit 1
      - name: Test
        run: uv run --with pytest pytest -q
